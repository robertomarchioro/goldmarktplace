<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 200"
     width="600"
     height="200"
     role="img"
     aria-label="A slipper flies in a parabolic arc and lands with a SCIAF impact, on loop">

  <!-- Loop is 2.5s total:
       0.0 — 0.3s  : rest (everything invisible)
       0.3 — 1.4s  : slipper flies along arc, tumbling
       1.4 — 1.5s  : slipper fades out at impact
       1.4 — 1.72s : S'CIAF! punches in (scale + fade-in)
       1.72 — 2.3s : S'CIAF! held
       2.3 — 2.5s  : S'CIAF! fades out, then loop restarts -->

  <!-- ====== Flying slipper ====== -->
  <g>
    <text x="0" y="0"
          font-size="36"
          text-anchor="middle"
          dominant-baseline="central"
          opacity="0">🩴
      <!-- Visible only during the flight + impact moment -->
      <animate
          attributeName="opacity"
          dur="2.5s"
          repeatCount="indefinite"
          values="0; 1; 1; 0; 0"
          keyTimes="0; 0.12; 0.56; 0.62; 1"/>
    </text>

    <!-- Stay at launch point until 0.3s, fly along arc until 1.4s, hold landing -->
    <animateMotion
        dur="2.5s"
        repeatCount="indefinite"
        keyPoints="0; 0; 1; 1"
        keyTimes="0; 0.12; 0.56; 1"
        path="M 50 150 Q 300 -30 470 150"/>

    <!-- Tumble in flight: rest, rotate end-over-end, hold -->
    <animateTransform
        attributeName="transform"
        type="rotate"
        dur="2.5s"
        repeatCount="indefinite"
        values="-25; -25; 35; 35"
        keyTimes="0; 0.12; 0.56; 1"
        additive="sum"/>
  </g>

  <!-- ====== S'CIAF! impact text ====== -->
  <g transform="translate(470 145)" opacity="0">
    <!-- Opacity: invisible during flight, visible during impact + hold, fade out before loop -->
    <animate
        attributeName="opacity"
        dur="2.5s"
        repeatCount="indefinite"
        values="0; 0; 1; 1; 0"
        keyTimes="0; 0.56; 0.6; 0.92; 1"/>

    <g>
      <text x="0" y="0"
            font-size="44"
            font-weight="900"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="Impact, 'Arial Black', Helvetica, sans-serif"
            fill="#e53935"
            stroke="#000"
            stroke-width="1.5"
            paint-order="stroke fill">S'CIAF!</text>

      <!-- Punch scale: held tiny during flight, overshoot, settle, then hold -->
      <animateTransform
          attributeName="transform"
          type="scale"
          dur="2.5s"
          repeatCount="indefinite"
          values="0.3; 0.3; 1.45; 1.0; 1.0"
          keyTimes="0; 0.56; 0.637; 0.688; 1"/>
    </g>
  </g>
</svg>
