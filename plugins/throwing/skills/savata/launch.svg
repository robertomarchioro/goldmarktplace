<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 200"
     width="600"
     height="200"
     role="img"
     aria-label="A slipper flies in a parabolic arc and lands with a SCIAF impact">

  <!-- ====== Flying slipper ====== -->
  <g>
    <text x="0" y="0"
          font-size="36"
          text-anchor="middle"
          dominant-baseline="central">🩴</text>

    <!-- Parabolic flight: from left baseline up and over to right baseline -->
    <animateMotion
        dur="1.1s"
        begin="0.3s"
        fill="freeze"
        path="M 50 150 Q 300 -30 470 150"/>

    <!-- Tumble in flight — the mythic infallible aim, end-over-end -->
    <animateTransform
        attributeName="transform"
        type="rotate"
        from="-25"
        to="35"
        dur="1.1s"
        begin="0.3s"
        fill="freeze"
        additive="sum"/>

    <!-- Fade out on impact so S'CIAF! takes the visual focus -->
    <animate
        attributeName="opacity"
        from="1"
        to="0"
        dur="0.12s"
        begin="1.4s"
        fill="freeze"/>
  </g>

  <!-- ====== S'CIAF! impact text ====== -->
  <g transform="translate(470 145)" opacity="0">
    <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur="0.1s"
        begin="1.4s"
        fill="freeze"/>

    <g>
      <text x="0" y="0"
            font-size="44"
            font-weight="900"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="Impact, 'Arial Black', Helvetica, sans-serif"
            fill="#e53935"
            stroke="#000"
            stroke-width="1.5"
            paint-order="stroke fill">S'CIAF!</text>

      <!-- Punch scale: start small, overshoot, settle -->
      <animateTransform
          attributeName="transform"
          type="scale"
          values="0.3; 1.45; 1.0"
          keyTimes="0; 0.6; 1"
          dur="0.32s"
          begin="1.4s"
          fill="freeze"/>
    </g>
  </g>
</svg>
